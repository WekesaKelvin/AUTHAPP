<div class="auth-container">
 

  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title class="header-title">Welcome Back</mat-card-title>
      <mat-card-subtitle class="subtitle">Login to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Username Field -->
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput placeholder="Username" formControlName="username" />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            Username is required
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" placeholder="Password" formControlName="password" />
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Password is required
          </mat-error>
        </mat-form-field>

        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage()">
          {{ errorMessage() }}
        </div>

        <!-- Login Button -->
        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="login-button">
          Login
        </button>
      </form>
    </mat-card-content>

    <!-- Forgot Password Link -->
    <a routerLink="/forgot-password" class="forgot-password-link">Forgot Password?</a>

    <!-- Register Link -->
    <mat-card-actions>
      <p>Don't have an account?
        <a mat-button routerLink="/signup">Register</a>
      </p>
    </mat-card-actions>
    
  </mat-card>
</div>
